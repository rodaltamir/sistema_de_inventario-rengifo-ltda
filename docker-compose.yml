version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_inventario
      POSTGRES_PASSWORD: "SecureDB_Inv_2026!#"
      POSTGRES_DB: inventario_master_db
    # Removido el mapeo de puertos 5432:5432 hacia el host para evitar conflictos con otros proyectos haci para tener mayor escalabilidad
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario_app
    restart: unless-stopped
    ports:
      # Puerto 8080 asignado tanto en host como en contenedor
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://admin_inventario:SecureDB_Inv_2026!%23@db:5432/inventario_master_db?schema=public
      - NEXTAUTH_SECRET=b7d38392f9e42b6a1c8f0e5d4a9b2c7e8f1d3a6c9e0b4f5a
      # URL oficial con nombre de host y puerto 8080
      - NEXTAUTH_URL=http://rengifo_ltda:8080
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL_INTERNAL=http://localhost:8080
      - NODE_OPTIONS=--max-http-header-size=65536
    depends_on:
      - db

volumes:
  pgdata:

